<script>
/* Zikr Deen intro v3 — Milky Way + rotating 3D Earth. Stays on screen until the viewer swipes up (no auto-advance). */
(()=>{
 const root=document.getElementById('zd-cosmic-intro'),canvas=document.getElementById('zd-cosmic-canvas'),btn=document.getElementById('zd-cosmic-skip');
 if(!root)return;
 const TAU=Math.PI*2,MIN_STAY=4500;
 let leaving=false,ready=false,started=false,raf=0,w=0,h=0,dpr=1,t0=0,bot=0;
 const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
 const small=Math.min(window.innerWidth,window.innerHeight)<700;
 try{history.scrollRestoration='manual'}catch(e){}
 const fallbackOut=()=>{try{cancelAnimationFrame(raf)}catch(e){}root.remove()};
 try{
 const ctx=canvas.getContext('2d');if(!ctx){fallbackOut();return}

 /* ================= leave: ONLY on the viewer's own gesture ================= */
 function removeNow(){cancelAnimationFrame(raf);root.remove();try{scrollTo(0,0)}catch(e){}}
 function leave(){
  if(leaving||!ready)return;leaving=true;root.classList.add('zd-leaving');
  root.style.transition='transform .85s cubic-bezier(.22,.8,.24,1)';
  root.style.transform='translate3d(0,-102%,0)';
  let fin=false;const end=()=>{if(fin)return;fin=true;removeNow()};
  root.addEventListener('transitionend',e=>{if(e.target===root)end()});setTimeout(end,1100)};
 let drag=false,sy=0,dy=0,st=0;
 root.addEventListener('pointerdown',e=>{if(!ready||leaving||e.target.closest('button'))return;drag=true;sy=e.clientY;dy=0;st=performance.now();root.style.transition='none';try{root.setPointerCapture(e.pointerId)}catch(_){}});
 root.addEventListener('pointermove',e=>{if(!drag)return;dy=Math.max(0,sy-e.clientY);root.style.transform='translate3d(0,'+(-dy)+'px,0)'});
 const up=()=>{if(!drag)return;drag=false;const v=dy/Math.max(1,performance.now()-st);
  if(dy>Math.min(90,h*.12)||(v>.45&&dy>24))leave();
  else{root.style.transition='transform .35s ease';root.style.transform='translate3d(0,0,0)'}};
 root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
 root.addEventListener('wheel',e=>{e.preventDefault();if(ready&&e.deltaY>6)leave()},{passive:false});
 document.addEventListener('keydown',e=>{if(!document.getElementById('zd-cosmic-intro'))return;if(['ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();leave()}});
 if(btn)btn.addEventListener('click',leave);

 /* ================= procedural noise (seamless on a sphere) ================= */
 const hs=(x,y,z,s)=>{let k=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1274126177)^Math.imul(s,2246822519);k=Math.imul(k^(k>>>13),1274126177);k^=k>>>16;return(k>>>0)/4294967295};
 const sm=t=>t*t*(3-2*t);
 function vn(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),u=sm(x-xi),v=sm(y-yi),q=sm(z-zi);
  const g=(a,b,c)=>hs(xi+a,yi+b,zi+c,s),L=(a,b,t)=>a+(b-a)*t;
  return L(L(L(g(0,0,0),g(1,0,0),u),L(g(0,1,0),g(1,1,0),u),v),L(L(g(0,0,1),g(1,0,1),u),L(g(0,1,1),g(1,1,1),u),v),q)}
 const fbm=(x,y,z,s,o)=>{let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*vn(x*f,y*f,z*f,s+i);n+=a;a*=.5;f*=2.03}return t/n};

 /* ---------- Earth surface textures, generated a few rows per frame (no main-thread stall) ---------- */
 const TW=small?320:384,TH=TW>>1,alb=new Uint8ClampedArray(TW*TH*4),lights=new Uint8Array(TW*TH),cloud=new Uint8Array(TW*TH),oceanM=new Uint8Array(TW*TH),hgt=new Uint8Array(TW*TH);
 let texRow=0,texReady=false,eStart=0;
 function genRows(ms){const tt=performance.now();
  while(texRow<TH&&performance.now()-tt<ms){const j=texRow++,lat=(.5-(j+.5)/TH)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat);
   for(let i=0;i<TW;i++){const lon=(i+.5)/TW*TAU,x=cl*Math.cos(lon),y=sl,z=cl*Math.sin(lon),k=j*TW+i;
    const n=fbm(x*2.1+5,y*2.1+5,z*2.1+5,11,6),al=Math.abs(lat)/(Math.PI/2);let r,g,b;
    if(al>.86||(al>.78&&n>.5&&fbm(x*6,y*6,z*6,3,3)>.5)){r=236;g=244;b=250;oceanM[k]=0}
    else if(n>.535){const a=Math.min(1,(n-.535)/.22),dry=fbm(x*3+9,y*3+9,z*3+9,21,4);
     if(a>.7){r=146;g=124;b=96}else if(dry>.56&&al<.5){r=205;g=176;b=104}else{r=58+a*60;g=128+a*18-dry*20;b=66}
     oceanM[k]=0}
    else{const d=Math.min(1,(.535-n)/.2);r=10+10*(1-d);g=70+36*(1-d);b=140+50*(1-d);oceanM[k]=255}
    hgt[k]=Math.max(0,Math.min(255,n*255));alb[k*4]=r;alb[k*4+1]=g;alb[k*4+2]=b;alb[k*4+3]=255;
    lights[k]=(n>.545&&al<.7&&fbm(x*38,y*38,z*38,7,2)>.62&&fbm(x*4,y*4,z*4,31,3)>.45)?255:0;
    const c=fbm(x*3.4+2,y*3.4+2,z*3.4+2,41,5);cloud[k]=Math.max(0,Math.min(1,(c-.5)*3.2))*215}}
  if(texRow>=TH&&!texReady){texReady=true;eStart=performance.now()}}

 /* ---------- sphere lookup (rebuilt when the on-screen size changes) ---------- */
 let S=0,idx,jj,latf,lon0,lit,spec,limb,off,octx,img,d32;
 const tilt=.41,ct=Math.cos(tilt),st2=Math.sin(tilt),Ld=(()=>{const a=[-.55,.45,.7],m=Math.hypot(...a);return a.map(v=>v/m)})();
 function buildSphere(size){S=size;const N=S*S;idx=new Int8Array(N).fill(-1);jj=new Uint16Array(N);latf=new Float32Array(N);lon0=new Float32Array(N);lit=new Float32Array(N);spec=new Float32Array(N);limb=new Float32Array(N);
  for(let py=0;py<S;py++)for(let px=0;px<S;px++){const x=(px+.5-S/2)/(S/2),y=-(py+.5-S/2)/(S/2),r2=x*x+y*y;if(r2>1)continue;const z=Math.sqrt(1-r2),p=py*S+px;
   const bx=x*ct+y*st2,by=-x*st2+y*ct,lat=Math.asin(Math.max(-1,Math.min(1,by))),lo=Math.atan2(z,bx);
   idx[p]=1;jj[p]=Math.min(TH-1,Math.max(0,((.5-lat/Math.PI)*TH)|0));latf[p]=(.5-lat/Math.PI)*TH-.5;lon0[p]=lo/TAU;
   const d=x*Ld[0]+y*Ld[1]+z*Ld[2];lit[p]=d;const hx=Ld[0],hy=Ld[1],hz=Ld[2]+1,hm=Math.hypot(hx,hy,hz),nh=(x*hx+y*hy+z*hz)/hm;spec[p]=Math.pow(Math.max(0,nh),60);limb[p]=Math.pow(1-z,3)}
  off=document.createElement('canvas');off.width=off.height=S;octx=off.getContext('2d');img=octx.createImageData(S,S);d32=img.data}
 function renderEarth(rot){const cr=rot*.62,TH1=TH-1;
  for(let p=0;p<S*S;p++){const q=p*4;if(idx[p]<0){d32[q+3]=0;continue}
   let lf=latf[p],j0=Math.floor(lf);const fy=lf-j0;let j1=j0+1;j0=j0<0?0:(j0>TH1?TH1:j0);j1=j1<0?0:(j1>TH1?TH1:j1);
   const u=(lon0[p]+rot)*TW-.5,iu=Math.floor(u),fx=u-iu,i0=((iu%TW)+TW)%TW,i1=(i0+1)%TW;
   const a0=j0*TW,a1=j1*TW,k00=(a0+i0)*4,k10=(a0+i1)*4,k01=(a1+i0)*4,k11=(a1+i1)*4,w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
   const kn=a0+(fx>.5?i1:i0);
   let r=alb[k00]*w00+alb[k10]*w10+alb[k01]*w01+alb[k11]*w11,g=alb[k00+1]*w00+alb[k10+1]*w10+alb[k01+1]*w01+alb[k11+1]*w11,b=alb[k00+2]*w00+alb[k10+2]*w10+alb[k01+2]*w01+alb[k11+2]*w11;
   const L=lit[p],day=Math.max(0,Math.min(1,(L+.08)/.55)),amb=.09+.91*day;
   /* relief shading on land: height difference across the light direction */
   let em=1;if(!oceanM[kn]){const il=(i0+TW-1)%TW,ir=(i0+2)%TW;em=1+Math.max(-.35,Math.min(.45,(hgt[a0+il]-hgt[a0+ir])/255*5.2))}
   r*=amb*em;g*=amb*em;b*=amb*em;
   if(oceanM[kn]){const s=spec[p]*day*190;r+=s;g+=s;b+=s*.95}
   let cu=(lon0[p]+cr)*TW-.5;const ci=Math.floor(cu),cf=cu-ci,c0=((ci%TW)+TW)%TW,c1=(c0+1)%TW;
   const ca=((cloud[a0+c0]*(1-cf)+cloud[a0+c1]*cf)*(1-fy)+(cloud[a1+c0]*(1-cf)+cloud[a1+c1]*cf)*fy)/255;
   const cs=ca*(.14+.86*day);r=r*(1-ca*.85)+235*cs;g=g*(1-ca*.85)+240*cs;b=b*(1-ca*.85)+250*cs;
   if(day<.35&&lights[kn]){const a=(1-day/.35)*(1-ca*.7);r+=255*a;g+=190*a;b+=90*a}
   const lb=limb[p]*(.35+.65*day);r+=60*lb;g+=190*lb;b+=235*lb;
   d32[q]=r;d32[q+1]=g;d32[q+2]=b;d32[q+3]=255}
  octx.putImageData(img,0,0)}

 /* ================= Milky Way: drawn once face-on, then tilted + rotated every frame ================= */
 let gal=null;
 function buildGalaxy(){

    x=R+Math.cos(th)*r+gs()*R*.05,y=R+Math.sin(th)*r+gs()*R*.05,rr=R*(.05+.1*rnd()),

 /* ================= sizing ================= */
 let bx=0,b1={y0:0,y1:0,wt:8,wb:60},b2={y0:0,y1:0,wt:30,wb:60},stars=[],shoot=[],nextShoot=2200,eR=40,eCy=0,frame=0,earthEvery=small?2:1,slow=0,lastT=0;
 function geom(){const rr=root.getBoundingClientRect();
  const rel=e=>{if(!e)return{t:0,h:0,w:0,cx:w/2};const r=e.getBoundingClientRect();return{t:r.top-rr.top,h:r.height,w:r.width,cx:r.left-rr.left+r.width/2}};

  eR=Math.max(28,Math.min(SL.h*.31,w*.16,96));eCy=SL.t+SL.h*.47;
  bx=w*.5;b1={y0:A.t+A.h*.8,y1:Q.t+Q.h*.3,wt:8,wb:Math.min(130,Q.w*.5)};b2={y0:Q.t+Q.h*.58,y1:eCy-eR*1.08,wt:Math.min(70,Q.w*.3),wb:eR*1.2};

 function layout(){const rr=root.getBoundingClientRect(),sb=root.querySelector('.zd-cosmic-sub');

 /* light falling from Allah onto the Quran, and from the Quran onto the Earth */

   ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-wt*k/2,y0);ctx.lineTo(x+wt*k/2,y0);ctx.lineTo(x+wf*k/2,yf);ctx.lineTo(x-wf*k/2,yf);ctx.closePath();ctx.fill()}

 /* ================= frame ================= */
 function draw(now,still){

  ctx.clearRect(0,0,w,h);

  const zoom=still?1:.86+.14*(1-Math.pow(1-Math.min(1,t/5),3)),Sg=Math.min(w*1.28,h*1.25)*zoom,gcx=w*.5,gcy=h*.54;

   ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.035);const tr=R*1.2;for(let i=0;i<72;i++){const a=i/72*TAU,l=i%6?3:7;ctx.strokeStyle=i%6?'rgba(130,230,240,.25)':'rgba(255,220,140,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.cos(a)*tr,Math.sin(a)*tr);ctx.lineTo(Math.cos(a)*(tr+l),Math.sin(a)*(tr+l));ctx.stroke()}ctx.restore();
   const sa=t*.45,cr=Math.cos(-.28),sr=Math.sin(-.28),sx=cx+Math.cos(sa)*R*1.55*cr-Math.sin(sa)*R*.42*sr,sy=cy+Math.cos(sa)*R*1.55*sr+Math.sin(sa)*R*.42*cr;

   ctx.restore()}

 /* ================= start (after the Arabic font is ready, so "الله" never flashes in a fallback font) ================= */
 function go(){if(started)return;started=true;layout();root.classList.add('zd-go');t0=performance.now();lastT=t0;
  setTimeout(()=>{ready=true;root.classList.add('zd-ready')},MIN_STAY);
  if(reduced)draw(0,true);else raf=requestAnimationFrame(draw)}
 buildGalaxy();
 let fp;try{fp=Promise.all([document.fonts.load('96px "Amiri Quran"','\u0627\u0644\u0644\u0647'),document.fonts.ready])}catch(e){fp=Promise.resolve()}
 Promise.race([fp,new Promise(r=>setTimeout(r,1400))]).then(go,go);
 let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(started&&document.getElementById('zd-cosmic-intro')){layout();if(reduced)draw(0,true)}},120)},{passive:true});
 }catch(err){console.warn('intro fallback',err);fallbackOut()}
